name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (sqlite, no infrastructure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  queue-tests:
    name: queue tests (postgres, SKIP LOCKED)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: certgen
          POSTGRES_PASSWORD: certgen
          POSTGRES_DB: certgen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U certgen"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -m postgres -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://certgen:certgen@localhost:5432/certgen
