[project]
name = "bulk-certificate-generator"
version = "1.0.0"
description = "Bulk certificate generation API with a database-backed work queue"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.27", "pypdf>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a live PostgreSQL database (set TEST_DATABASE_URL)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
